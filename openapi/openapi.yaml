openapi: 3.0.3
info:
  title: СпортСлот API
  version: "2.0.0"
  description: |
    API чат-бота и мини-приложения СпортСлот (пилот — Ростов-на-Дону).

    Данные: каталог площадок — реальные объекты OpenStreetMap (ODbL);
    студии с онлайн-записью — демо-партнёры с модельным расписанием
    (`source: demo_partner`), их можно отключить переменной DEMO_DATA=off.

    Авторизация пользователя: `Authorization: tma <initData>` — подписанные
    данные запуска мини-приложения MAX, проверяются по алгоритму
    https://dev.max.ru/docs/webapps/validation. Заголовок `X-MAX-User-ID`
    принимается только для тестовых учётных записей (TEST_MAX_USER_IDS).

    Кабинет студии: `POST /partner/login` с кодом доступа возвращает токен,
    который передаётся как `Authorization: Partner <token>`.
servers:
  - url: https://sportslot.space
    description: Пилотный сервер
  - url: http://localhost:8080
    description: Локальный запуск (docker compose up)
tags:
  - name: system
  - name: catalog
  - name: bookings
  - name: partner
  - name: studio
    description: Кабинет студии — администратор по подписи MAX, демо-доступ по токену partner
  - name: platform
    description: Подключение студий и приглашения — только PLATFORM_ADMIN_IDS
paths:
  /api/v1/health:
    get:
      tags: [system]
      summary: Проверка работоспособности
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
  /api/v1/stats:
    get:
      tags: [system]
      summary: Воронка пилота за 30 дней (уникальные пользователи по шагам, без персональных данных)
      responses:
        "200":
          description: Агрегаты
          content:
            application/json:
              schema:
                type: object
                properties:
                  since: { type: string, format: date-time }
                  unique_users:
                    type: object
                    additionalProperties: { type: integer }
                    example: { start: 40, quiz_done: 18, search: 35, booking_created: 12, attended: 5 }
  /api/v1/catalog:
    get:
      tags: [catalog]
      summary: Справочники — виды спорта, районы, окна времени, вопросы подбора, источники данных
      responses:
        "200":
          description: Справочники
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
  /api/v1/quiz/recommend:
    post:
      tags: [catalog]
      summary: Подбор вида спорта по ответам (детерминированный, с объяснением)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: object
                  additionalProperties: { type: string }
                  example: { goal: stress, water: love, format: solo, pace: calm, contact: "no" }
      responses:
        "200":
          description: До трёх видов спорта
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/QuizResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/venues:
    get:
      tags: [catalog]
      summary: Площадки по фильтрам — сначала студии с онлайн-записью, затем остальные по времени в пути или расстоянию
      parameters:
        - { name: sport, in: query, schema: { $ref: "#/components/schemas/SportId" } }
        - { name: when, in: query, schema: { type: string, enum: [today, tomorrow, weekday_eve, weekend, any] } }
        - { name: district, in: query, schema: { type: string, example: sovetsky } }
        - { name: lat, in: query, schema: { type: number, example: 47.2336 } }
        - { name: lon, in: query, schema: { type: number, example: 39.6179 } }
        - name: mode
          in: query
          description: Способ передвижения для расчёта времени в пути (вместе с lat/lon)
          schema: { type: string, enum: [walking, transit, driving] }
        - name: max_minutes
          in: query
          description: Не показывать залы дальше этого времени в пути; 0 — без лимита
          schema: { type: integer, minimum: 0, maximum: 180, example: 20 }
        - { name: instant_only, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Карточки площадок
          content:
            application/json:
              schema:
                type: object
                required: [venues, meta]
                properties:
                  venues:
                    type: array
                    items: { $ref: "#/components/schemas/VenueCard" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/venues/{id}:
    get:
      tags: [catalog]
      summary: Площадка и её расписание на 14 дней
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Площадка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueDetails" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/geocode:
    get:
      tags: [catalog]
      summary: Адрес в Ростове-на-Дону → координаты (геокодер 2ГИС на сервере)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 200, example: "Большая Садовая, 1" } }
      responses:
        "200":
          description: Найденная точка
          content:
            application/json:
              schema:
                type: object
                properties:
                  lat: { type: number }
                  lon: { type: number }
                  address: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: Слишком много запросов }
        "503": { description: Геокодер недоступен (нет ключа или ошибка 2ГИС) }
  /api/v1/search:
    post:
      tags: [catalog]
      summary: Свободные занятия с онлайн-записью в радиусе от точки (совместимость с MVP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sport_type]
              properties:
                sport_type: { $ref: "#/components/schemas/SportId" }
                lat: { type: number, example: 47.2225 }
                lon: { type: number, example: 39.7185 }
                radius_km: { type: number, example: 20 }
                date_from: { type: string, format: date }
                date_to: { type: string, format: date }
                time_from: { type: string, example: "18:00" }
                time_to: { type: string, example: "21:00" }
                level: { type: string, example: beginner }
      responses:
        "200":
          description: Найденные занятия
          content:
            application/json:
              schema:
                type: object
                required: [results, meta]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/SlotResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/me:
    get:
      tags: [bookings]
      summary: Текущий пользователь и его записи
      security: [{ initData: [] }, { testUser: [] }]
      responses:
        "200":
          description: Пользователь и записи
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                  bookings:
                    type: array
                    items: { $ref: "#/components/schemas/BookingView" }
                  last_location:
                    type: object
                    description: Последняя точка, отправленная боту в чат (не старше 7 дней)
                    properties:
                      lat: { type: number }
                      lon: { type: number }
                      address: { type: string }
                      at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/bookings:
    post:
      tags: [bookings]
      summary: Записаться на занятие (идемпотентно)
      security: [{ initData: [] }, { testUser: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot_id]
              properties:
                slot_id: { type: string, format: uuid, example: b1111111-0000-0000-0000-000000000001 }
                source_channel: { type: string, enum: [bot, miniapp], default: miniapp }
      responses:
        "201":
          description: Запись создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingView" }
        "200":
          description: Пользователь уже записан — возвращается существующая запись
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/bookings/{id}:
    get:
      tags: [bookings]
      summary: Запись пользователя (экран QR-пропуска)
      security: [{ initData: [] }, { testUser: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Запись
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [bookings]
      summary: Отменить запись; место уходит первому из листа ожидания
      security: [{ initData: [] }, { testUser: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Запись отменена }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/bookings/{id}/cancel:
    post:
      tags: [bookings]
      summary: То же, что DELETE /bookings/{id}
      security: [{ initData: [] }, { testUser: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Запись отменена }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/bookings/{id}/reschedule:
    patch:
      tags: [bookings]
      summary: Перенести запись на другое занятие (код входа сохраняется)
      security: [{ initData: [] }, { testUser: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_slot_id]
              properties:
                new_slot_id: { type: string, format: uuid, example: b1111111-0000-0000-0000-000000000002 }
      responses:
        "200":
          description: Запись перенесена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/bookings/{id}/feedback:
    post:
      tags: [bookings]
      summary: Оценка занятия после отметки посещения
      security: [{ initData: [] }, { testUser: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "204": { description: Оценка сохранена }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/bookings/user/{user_id}:
    get:
      tags: [bookings]
      summary: Все записи пользователя по внутреннему id (только свои)
      security: [{ initData: [] }, { testUser: [] }]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Список записей
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/waitlist:
    post:
      tags: [bookings]
      summary: Встать в лист ожидания на заполненное занятие
      security: [{ initData: [] }, { testUser: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot_id]
              properties:
                slot_id: { type: string, format: uuid }
      responses:
        "201":
          description: Позиция в очереди
          content:
            application/json:
              schema:
                type: object
                properties:
                  position: { type: integer, example: 1 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/partner/login:
    post:
      tags: [partner]
      summary: Вход в кабинет студии по коду (не больше 10 попыток в минуту с IP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Токен сессии на 12 часов
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Слишком много попыток }
  /api/v1/partner/bookings:
    get:
      tags: [partner]
      summary: Записи в студии-партнёры на ближайшую неделю
      security: [{ partner: [] }]
      responses:
        "200":
          description: Записи с именами клиентов
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items: { $ref: "#/components/schemas/BookingView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/partner/checkin:
    post:
      tags: [partner]
      summary: Отметить посещение по QR (SPORTSLOT:123456) или шестизначному коду
      security: [{ partner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "SPORTSLOT:545296" }
      responses:
        "200":
          description: Посещение отмечено, клиенту уходит вопрос «Как прошло?»
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Посещение по этому коду уже отмечено }
  /api/v1/partner/bookings/{id}/remind:
    post:
      tags: [partner]
      summary: Отправить клиенту напоминание сейчас (для демонстрации, только демо-партнёры)
      security: [{ partner: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Напоминание отправлено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/me/location:
    post:
      tags: [bookings]
      summary: Сохранить геолокацию из мини-приложения; бот продолжает подбор с этой точки
      security: [{ initData: [] }, { testUser: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat: { type: number, example: 47.2336 }
                lon: { type: number, example: 39.6179 }
                address: { type: string }
      responses:
        "200":
          description: Точка сохранена; sport и when — выбор пользователя в чате, если он есть
          content:
            application/json:
              schema:
                type: object
                properties:
                  sport: { type: string }
                  when: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/messages:
    get:
      tags: [bookings]
      summary: Переписка пользователя со студией
      security: [{ initData: [] }, { testUser: [] }]
      parameters:
        - { name: venue_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Сообщения по времени
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
    post:
      tags: [bookings]
      summary: Написать студии; администраторы получают уведомление в бот
      security: [{ initData: [] }, { testUser: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venue_id, text]
              properties:
                venue_id: { type: string, format: uuid }
                text: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Сообщение отправлено
          content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/studio/invites/accept:
    post:
      tags: [studio]
      summary: Принять ссылку-приглашение и стать администратором студии
      security: [{ initData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, pattern: "^[0-9a-f]{32}$" }
      responses:
        "200":
          description: Студия, к которой выдан доступ
          content: { application/json: { schema: { $ref: "#/components/schemas/Venue" } } }
        "400": { description: Приглашение недействительно или уже использовано }
  /api/v1/studio/me:
    get:
      tags: [studio]
      summary: Студии, доступные пользователю, со счётчиками записей и непрочитанных сообщений
      security: [{ initData: [] }, { partner: [] }]
      responses:
        "200":
          description: Пустой список — пользователь не администратор
          content:
            application/json:
              schema:
                type: object
                properties:
                  platform: { type: boolean }
                  demo: { type: boolean }
                  studios:
                    type: array
                    items:
                      type: object
                      properties:
                        venue: { $ref: "#/components/schemas/Venue" }
                        today_bookings: { type: integer }
                        upcoming_bookings: { type: integer }
                        unread_messages: { type: integer }
  /api/v1/studio/checkin:
    post:
      tags: [studio]
      summary: Отметить посещение по QR или коду; код 000000 — учебный пропуск
      security: [{ initData: [] }, { partner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "SPORTSLOT:000000" }
      responses:
        "200":
          description: Посещение отмечено или {training:true, message} для учебного пропуска
          content: { application/json: { schema: { $ref: "#/components/schemas/BookingView" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Посещение уже отмечено }
  /api/v1/studio/bookings/{id}:
    get:
      tags: [studio]
      summary: Карточка клиента по записи — история в студии, посещения, неявки, переписка
      security: [{ initData: [] }, { partner: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: "{booking, history, visits, no_shows, messages}" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/studio/bookings/{id}/remind:
    post:
      tags: [studio]
      summary: Прислать клиенту напоминание с «Иду / Не смогу» сейчас
      security: [{ initData: [] }, { partner: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Напоминание отправлено }
  /api/v1/studio/{venue_id}/bookings:
    get:
      tags: [studio]
      summary: Записи в студию на ближайшую неделю
      security: [{ initData: [] }, { partner: [] }]
      parameters: [{ $ref: "#/components/parameters/VenueId" }]
      responses:
        "200": { description: "{bookings: BookingView[]}" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/studio/{venue_id}/templates:
    get:
      tags: [studio]
      summary: Недельный шаблон расписания
      security: [{ initData: [] }, { partner: [] }]
      parameters: [{ $ref: "#/components/parameters/VenueId" }]
      responses:
        "200":
          description: Шаблоны по дням недели
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates: { type: array, items: { $ref: "#/components/schemas/Template" } }
    post:
      tags: [studio]
      summary: Добавить занятие в шаблон; занятия на 14 дней создаются сразу
      security: [{ initData: [] }, { partner: [] }]
      parameters: [{ $ref: "#/components/parameters/VenueId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } }
      responses:
        "201": { description: "{template, kept_with_bookings}" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/studio/{venue_id}/templates/{template_id}:
    put:
      tags: [studio]
      summary: Изменить занятие шаблона; будущие занятия с записями не переносятся
      security: [{ initData: [] }, { partner: [] }]
      parameters:
        - { $ref: "#/components/parameters/VenueId" }
        - { name: template_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } }
      responses:
        "200": { description: "{template, kept_with_bookings}" }
    delete:
      tags: [studio]
      summary: Удалить занятие из шаблона; занятия с записями остаются
      security: [{ initData: [] }, { partner: [] }]
      parameters:
        - { $ref: "#/components/parameters/VenueId" }
        - { name: template_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{kept_with_bookings}" }
  /api/v1/studio/{venue_id}/slots:
    get:
      tags: [studio]
      summary: Ближайшие занятия студии с числом записей
      security: [{ initData: [] }, { partner: [] }]
      parameters: [{ $ref: "#/components/parameters/VenueId" }]
      responses:
        "200": { description: "{slots: [{…slot, booked, closed, cancelled}]}" }
  /api/v1/studio/{venue_id}/slots/{slot_id}/close:
    post:
      tags: [studio]
      summary: Приостановить или возобновить запись на занятие
      security: [{ initData: [] }, { partner: [] }]
      parameters:
        - { $ref: "#/components/parameters/VenueId" }
        - { name: slot_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { closed: { type: boolean } } }
      responses:
        "204": { description: Готово }
  /api/v1/studio/{venue_id}/slots/{slot_id}/cancel:
    post:
      tags: [studio]
      summary: Отменить занятие; записавшиеся получают сообщение с контактами студии
      security: [{ initData: [] }, { partner: [] }]
      parameters:
        - { $ref: "#/components/parameters/VenueId" }
        - { name: slot_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{notified: число клиентов}" }
  /api/v1/studio/{venue_id}/stats:
    get:
      tags: [studio]
      summary: Статистика за 30 дней
      security: [{ initData: [] }, { partner: [] }]
      parameters: [{ $ref: "#/components/parameters/VenueId" }]
      responses:
        "200": { description: "{bookings, attended, no_show, cancelled_by_client, upcoming, clients, returning_clients, rating_avg, ratings}" }
  /api/v1/studio/{venue_id}/profile:
    patch:
      tags: [studio]
      summary: Телефон, сайт, описание, «что взять», цена пробного занятия
      security: [{ initData: [] }]
      parameters: [{ $ref: "#/components/parameters/VenueId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                website: { type: string }
                description: { type: string }
                what_to_bring: { type: string }
                trial_price: { type: integer, nullable: true }
      responses:
        "200":
          description: Обновлённая студия
          content: { application/json: { schema: { $ref: "#/components/schemas/Venue" } } }
        "403": { description: В демо-доступе профиль только просматривается }
  /api/v1/studio/{venue_id}/threads:
    get:
      tags: [studio]
      summary: Переписки студии с клиентами
      security: [{ initData: [] }, { partner: [] }]
      parameters: [{ $ref: "#/components/parameters/VenueId" }]
      responses:
        "200": { description: "{threads: [{user_id, user_name, last_text, last_at, last_by, unread}]}" }
  /api/v1/studio/{venue_id}/threads/{user_id}:
    get:
      tags: [studio]
      summary: Переписка с клиентом (помечается прочитанной)
      security: [{ initData: [] }, { partner: [] }]
      parameters:
        - { $ref: "#/components/parameters/VenueId" }
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{user, messages: Message[]}" }
    post:
      tags: [studio]
      summary: Ответить клиенту; ответ приходит ему в чат с ботом
      security: [{ initData: [] }, { partner: [] }]
      parameters:
        - { $ref: "#/components/parameters/VenueId" }
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 2000 } } }
      responses:
        "201":
          description: Ответ отправлен
          content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
  /api/v1/platform/studios:
    get:
      tags: [platform]
      summary: Студии с онлайн-записью, их администраторы и активные приглашения
      security: [{ initData: [] }]
      responses:
        "200": { description: "{studios: [{venue, admins, invites}]}" }
        "403": { description: Только для PLATFORM_ADMIN_IDS }
    post:
      tags: [platform]
      summary: Подключить зал из каталога ({venue_id}) или добавить новую студию ({name, address, sports, phone})
      security: [{ initData: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "201":
          description: Подключённая студия
          content: { application/json: { schema: { $ref: "#/components/schemas/Venue" } } }
  /api/v1/platform/catalog:
    get:
      tags: [platform]
      summary: Поиск зала в каталоге OSM для подключения
      security: [{ initData: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200": { description: "{venues: Venue[]}" }
  /api/v1/platform/studios/{venue_id}/invites:
    post:
      tags: [platform]
      summary: Одноразовая ссылка-приглашение администратора студии на 7 дней
      security: [{ initData: [] }]
      parameters: [{ $ref: "#/components/parameters/VenueId" }]
      responses:
        "201": { description: "{token, link, expires_at}" }
  /api/v1/platform/studios/{venue_id}/admins/{max_user_id}:
    delete:
      tags: [platform]
      summary: Отозвать доступ администратора
      security: [{ initData: [] }]
      parameters:
        - { $ref: "#/components/parameters/VenueId" }
        - { name: max_user_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Доступ отозван }
  /bot/webhook:
    post:
      tags: [system]
      summary: Приём обновлений MAX (bot_started, message_created, message_callback)
      parameters:
        - { name: X-Max-Bot-Api-Secret, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Обновление принято }
        "401": { description: Неверный секрет }
components:
  securitySchemes:
    initData:
      type: apiKey
      in: header
      name: Authorization
      description: "tma <initData> — подписанные данные запуска мини-приложения MAX"
    testUser:
      type: apiKey
      in: header
      name: X-MAX-User-ID
      description: Только тестовые учётные записи (например, max-test-user-001)
    partner:
      type: apiKey
      in: header
      name: Authorization
      description: "Partner <token> — токен из POST /api/v1/partner/login; открывает кабинеты демо-студий"
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VenueId:
      name: venue_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Некорректный запрос
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Нет авторизации или подпись MAX не прошла проверку
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Запись принадлежит другому пользователю
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Не найдено
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: "Конфликт: quota_exceeded, slot_started, not_active, already_booked"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, example: quota_exceeded }
    SportId:
      type: string
      enum: [swimming, yoga, boxing, fitness, dance, team, tennis, athletics, multi]
    Meta:
      type: object
      required: [data_source, generated_at]
      properties:
        data_source: { type: string, example: osm+demo_partners }
        catalog_date: { type: string, format: date-time }
        generated_at: { type: string, format: date-time }
    Venue:
      type: object
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string, example: "osm:way/123456" }
        name: { type: string }
        sport_type: { $ref: "#/components/schemas/SportId" }
        sports: { type: array, items: { $ref: "#/components/schemas/SportId" } }
        address: { type: string }
        district: { type: string, example: voroshilovsky }
        lat: { type: number }
        lon: { type: number }
        source: { type: string, enum: [osm, demo_partner] }
        source_url: { type: string }
        booking_mode: { type: string, enum: [instant, external] }
        phone: { type: string }
        website: { type: string }
        opening_hours: { type: string, example: "Mo-Fr 07:00-22:00" }
        description: { type: string }
        what_to_bring: { type: string }
        trial_price: { type: integer, nullable: true, description: "Рубли; 0 — бесплатно" }
        verified_at: { type: string, format: date-time }
    SlotInfo:
      type: object
      properties:
        slot_id: { type: string, format: uuid }
        title: { type: string, example: Бокс для новичков }
        sport_type: { $ref: "#/components/schemas/SportId" }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        quota_total: { type: integer }
        quota_available: { type: integer }
    VenueCard:
      type: object
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        distance_km: { type: number }
        travel:
          type: object
          description: Время в пути от точки пользователя (есть, если переданы lat, lon и mode)
          properties:
            mode: { type: string, enum: [walking, transit, driving] }
            minutes: { type: integer, example: 14 }
            estimated: { type: boolean, description: "true — оценка по расстоянию, маршрут не построен" }
        beyond_limit: { type: boolean, description: "Зал за пределами max_minutes, добавлен, когда в лимит попало меньше 4 залов" }
        slots: { type: array, items: { $ref: "#/components/schemas/SlotInfo" } }
        available_slots: { type: integer }
    VenueDetails:
      allOf:
        - $ref: "#/components/schemas/Venue"
        - type: object
          required: [venue_id, name, address, all_slots]
          properties:
            venue_id: { type: string, format: uuid }
            all_slots: { type: array, items: { $ref: "#/components/schemas/SlotInfo" } }
    SlotResult:
      type: object
      properties:
        venue_id: { type: string, format: uuid }
        name: { type: string }
        sport_type: { type: string }
        level: { type: string }
        address: { type: string }
        district: { type: string }
        lat: { type: number }
        lon: { type: number }
        source: { type: string }
        source_ref: { type: string }
        slot: { $ref: "#/components/schemas/SlotInfo" }
    Booking:
      type: object
      required: [id, slot_id, status, source_channel]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        slot_id: { type: string, format: uuid }
        status: { type: string, enum: [confirmed, cancelled, attended, no_show] }
        source_channel: { type: string, enum: [bot, miniapp] }
        checkin_code: { type: string, example: "545296" }
        reminder_sent: { type: boolean }
        rating: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time, nullable: true }
        attended_at: { type: string, format: date-time, nullable: true }
    BookingView:
      allOf:
        - $ref: "#/components/schemas/Booking"
        - type: object
          properties:
            user_name: { type: string }
            slot:
              type: object
              properties:
                id: { type: string, format: uuid }
                venue_id: { type: string, format: uuid }
                title: { type: string }
                sport_type: { type: string }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
                quota_total: { type: integer }
                quota_booked: { type: integer }
            venue: { $ref: "#/components/schemas/Venue" }
    QuizResult:
      type: object
      properties:
        sport: { $ref: "#/components/schemas/SportId" }
        title: { type: string }
        score: { type: integer }
        reason: { type: string, example: Любишь воду и хочешь больше энергии. }
    Catalog:
      type: object
      properties:
        sports: { type: array, items: { type: object } }
        districts: { type: array, items: { type: object } }
        whens: { type: array, items: { type: object } }
        quiz: { type: array, items: { type: object } }
        data_sources:
          type: object
          properties:
            catalog: { type: string }
            catalog_date: { type: string, format: date-time }
            demo_partners: { type: boolean }
            partner_enabled: { type: boolean }
    Message:
      type: object
      properties:
        id: { type: integer }
        venue_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        author: { type: string, enum: [client, studio] }
        text: { type: string }
        created_at: { type: string, format: date-time }
    Template:
      type: object
      required: [title, sport_type, weekday, start_minute, duration_min, quota]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        title: { type: string, example: "Йога для начинающих" }
        sport_type: { type: string, example: yoga }
        level: { type: string, example: beginner }
        weekday: { type: integer, minimum: 0, maximum: 6, description: "0 — воскресенье" }
        start_minute: { type: integer, minimum: 0, maximum: 1439, example: 1140 }
        duration_min: { type: integer, minimum: 15, maximum: 300, example: 60 }
        quota: { type: integer, minimum: 1, maximum: 100, example: 4 }
