name: sportslot

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sportslot
      POSTGRES_USER: sportslot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportslot_dev_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportslot -d sportslot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_PORT: 8080
      DATABASE_URL: postgresql://sportslot:${POSTGRES_PASSWORD:-sportslot_dev_pass}@db:5432/sportslot?sslmode=disable
      MAX_BOT_API_BASE_URL: ${MAX_BOT_API_BASE_URL:-https://platform-api2.max.ru}
      MAX_BOT_API_TOKEN: ${MAX_BOT_API_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-dev_webhook_secret}
      MAX_WEBHOOK_URL: ${MAX_WEBHOOK_URL:-}
      MINI_APP_BUTTON: ${MINI_APP_BUTTON:-link}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MINI_APP_URL: ${MINI_APP_URL:-http://localhost:5173}
      NOTIFIER_INTERVAL_SECONDS: ${NOTIFIER_INTERVAL_SECONDS:-60}
      APP_ENV: ${APP_ENV:-dev}
      CATALOG_PATH: seed-data/rostov_catalog.json
      DEMO_DATA: ${DEMO_DATA:-on}
      PARTNER_DEMO_CODE: ${PARTNER_DEMO_CODE:-}
      TEST_MAX_USER_IDS: ${TEST_MAX_USER_IDS:-max-test-user-001}
    ports:
      - "${API_PORT:-8080}:8080"

  mini-app:
    build:
      context: .
      dockerfile: web/mini-app/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_DEV_MAX_USER_ID: ${VITE_DEV_MAX_USER_ID:-max-test-user-001}
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${MINI_APP_PORT:-5173}:80"

volumes:
  postgres-data:
